scalar DateTime

type User {
  id: ID!
  name: String!
  email: String!
  jobTitle: String
  location: String
  bio: String
  skills: [String!]!
  avatarUrl: String
}

enum KnowledgeType {
  technology
  concept
  algorithm
  database
}

enum ResourceType {
  article
  video
  documentation
  course
  github
  other
}

enum Relation {
  uses
  related_to
  part_of
  depends_on
  built_with
  extends
}

enum ActivityAction {
  created
  updated
  deleted
}

enum ActivityEntity {
  knowledge
  connection
  resource
  profile
}

type Knowledge {
  id: ID!
  title: String!
  description: String!
  type: KnowledgeType!
  tags: [String!]!
  user: User!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Activity {
  id: ID!
  action: ActivityAction!
  entityType: ActivityEntity!
  summary: String!
  createdAt: DateTime!
}

type ActivityPage {
  items: [Activity!]!
  nextCursor: String
  hasMore: Boolean!
}

type DashboardSummary {
  knowledgeCount: Int!
  connectionCount: Int!
  resourceCount: Int!
  uniqueTagCount: Int!
}

type UserSettings {
  language: String!
  timeZone: String!
  dateFormat: String!
  theme: String!
  accentColor: String!
  inAppNotifications: Boolean!
  emailNotifications: Boolean!
}

type Connection {
  id: ID!
  userId: ID!
  source: Knowledge!
  target: Knowledge!
  relation: Relation!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Resource {
  id: ID!
  userId: ID!
  knowledgeId: ID!
  title: String!
  url: String!
  type: ResourceType!
  description: String!
  user: User!
  knowledge: Knowledge!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input SignupInput {
  name: String!
  email: String!
  password: String!
}

type AuthPayload {
  token: String!
  user: User!
}

type AvatarUploadUrlPayload {
  uploadUrl: String!
  contentType: String!
  expiresIn: Int!
}

type Query {
  knowledge: [Knowledge!]!
  knowledgeById(id: ID!): Knowledge
  connections: [Connection!]!
  connectionsByKnowledge(id: ID!): [Connection!]!
  resources: [Resource!]!
  resourcesByKnowledge(id: ID!): [Resource!]!
  recentActivity(limit: Int = 20, cursor: String): ActivityPage!
  dashboardSummary: DashboardSummary!
  userSettings: UserSettings!
  me: User
}

input CreateKnowledgeInput {
  title: String!
  description: String!
  type: KnowledgeType!
  tags: [String!]!
}

input UpdateKnowledgeInput {
  title: String
  description: String
  type: KnowledgeType
  tags: [String!]
}

input CreateConnectionInput {
  sourceId: ID!
  targetId: ID!
  relation: Relation!
}

input UpdateConnectionInput {
  relation: Relation
}

input CreateResourceInput {
  knowledgeId: ID!
  title: String!
  url: String!
  type: ResourceType!
  description: String!
}

input UpdateResourceInput {
  title: String
  url: String
  type: ResourceType
  description: String
}

input UpdateProfileInput {
  name: String
  email: String
  jobTitle: String
  location: String
  bio: String
  skills: [String!]
}

input UpdateUserSettingsInput {
  language: String
  timeZone: String
  dateFormat: String
  theme: String
  accentColor: String
  inAppNotifications: Boolean
  emailNotifications: Boolean
}

input CreateAvatarUploadUrlInput {
  contentType: String!
  size: Int!
}

type Mutation {
  createKnowledge(input: CreateKnowledgeInput!): Knowledge!
  updateKnowledge(id: ID!, input: UpdateKnowledgeInput!): Knowledge!
  deleteKnowledge(id: ID!): Boolean!
  createConnection(input: CreateConnectionInput!): Connection!
  updateConnection(id: ID!, input: UpdateConnectionInput): Connection!
  deleteConnection(id: ID!): Boolean!
  createResource(input: CreateResourceInput!): Resource!
  updateResource(id: ID!, input: UpdateResourceInput!): Resource!
  deleteResource(id: ID!): Boolean!
  signup(input: SignupInput!): AuthPayload!
  login(email: String!, password: String!): AuthPayload!
  updateProfile(input: UpdateProfileInput!): User!
  updateUserSettings(input: UpdateUserSettingsInput!): UserSettings!
  createAvatarUploadUrl(input: CreateAvatarUploadUrlInput!): AvatarUploadUrlPayload!
  confirmAvatarUpload: User!
}
